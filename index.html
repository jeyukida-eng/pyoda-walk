<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e5">
<title>PYODA WALK · 서귀포 골목 도슨트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mobile-layout.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png?v=1">
<meta name="application-name" content="PYODA WALK">
<meta name="apple-mobile-web-app-title" content="PYODA WALK">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<main id="app">
  <section id="home" class="screen active">
    <header class="homeHead">
      <div class="eyebrow">PYODA WALK · 모바일 테스트</div>
      <h1>서귀포 골목 도슨트</h1>
      <p>관광지 밖, 마을이 살아온 길을 걷다</p>
    </header>
    <div class="hero">
      <div><strong>지도는 눈으로,<br>이야기는 귀로.</strong><p>마을을 골라 걸어보세요.</p></div>
      <div class="heroMark">10</div>
    </div>
    <div class="sectionRow"><h2>10개 마을</h2><span>전체 활성화</span></div>
    <div id="villageGrid" class="villageGrid"></div>
  </section>

  <section id="course" class="screen">
    <header class="bar"><button class="round" data-go="home">←</button><div><div id="courseEyebrow" class="eyebrow"></div><h1 id="courseName"></h1></div></header>
    <div class="courseCard">
      <p id="courseSubtitle" class="courseSubtitle"></p>
      <h2>걸으며 듣는 마을 이야기</h2>
      <div class="chips"><span id="courseDuration"></span><span>6개 이야기 지점</span><span id="courseTheme"></span></div>
      <p class="note">도착하면 자동으로 들려드립니다. 현재 보목포구 1곳 연결.</p>
    </div>
    <div id="pointPreview" class="pointPreview"></div>
    <div class="bottomAction"><button id="startBtn" class="primary">걷기 시작</button></div>
  </section>

  <section id="walk" class="screen walk">
    <header class="walkBar"><button class="round dark" data-go="course">←</button><div><small id="walkNo"></small><strong id="walkName"></strong></div><button id="zoomReset" class="round dark">◎</button></header>
    <div id="mapShell" class="mapShell">
      <div id="mapStage" class="mapStage">
        <img id="mapImage" alt="골목 도슨트 지도">
        <div id="pulse" class="pulse" aria-label="현재 위치"><span></span><i></i><b></b></div>
      </div>
      <div class="zoomCtl"><button id="zoomOut">−</button><button id="zoomIn">＋</button></div>
    </div>
    <div class="storySheet">
      <div class="sheetTop"><div><span class="mini">걷는 중</span><h2 id="storyTitle"></h2></div><strong id="progressPct">0%</strong></div>
      <div class="progress"><i id="progressBar"></i></div>
      <p id="storyText"></p>
      <div class="nextBox"><div><span class="mini">다음 장소</span><strong id="nextPlace"></strong><small id="nextEta"></small></div><button id="speakBtn" class="listen">▶ 이야기 듣기</button></div>
      <div class="controls"><button id="demoBtn">데모 걷기</button><button id="gpsBtn">자동 안내 시작</button><button id="pauseBtn" disabled>일시정지</button></div>
      <details id="placeSettings" class="placeSettings"><summary>장소 설정 · <span id="placeCount"></span></summary>
<p>정확한 안내 위치를 지정합니다. 직접 저장한 좌표는 이 기기에만 적용됩니다.</p>
<label>이야기 장소<select id="placeSelect"></select></label>
<div class="coordinateFields"><label>위도<input id="placeLat" type="number" step="any" inputmode="decimal" placeholder="33.…"></label><label>경도<input id="placeLng" type="number" step="any" inputmode="decimal" placeholder="126.…"></label></div>
<label>안내 반경(m)<input id="placeRadius" type="number" min="15" max="100" value="30" inputmode="numeric"></label>
<p id="placeSource" role="status"></p><a id="placeMap" target="_blank" rel="noopener">지도에서 장소 찾기 ↗</a>
<div class="settingActions"><button id="capturePlace">현재 위치로 지정</button><button id="savePlace">좌표 저장</button><button id="exportPlaces">좌표 내보내기</button><button id="resetWalk">들은 기록 초기화</button></div>
</details><div id="status" class="status">데모 걷기로 지도 위 위치점 이동을 먼저 확인할 수 있습니다.</div>
    </div>
  </section>
</main>
<script src="course-data.js"></script><script src="pyoda-location.js"></script><script src="arrival-engine.js"></script><script src="app.js"></script><script src="auto-docent.js"></script><script src="mobile-layout.js"></script>
<script>if(!window.PyodaNative && 'serviceWorker'in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
</body></html>
